[project]
name = "cinema-api"
version = "0.1.0"
requires-python = ">=3.12"
# Vercel installs from this list (it ignores requirements.txt when pyproject.toml exists).
# Keep it identical to requirements.txt; tests/test_dependencies.py checks that.
dependencies = [
    "fastapi==0.162.0",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.1",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
