<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="ns-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06070b"/>
      <stop offset="52%" stop-color="#0e111a"/>
      <stop offset="100%" stop-color="#050609"/>
    </linearGradient>
    <linearGradient id="ns-crimson" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e13f59" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#e13f59" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ns-cyan" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2cb7c9" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#2cb7c9" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#ns-bg)"/>
  <!-- Noir skyline & Kok-Tobe spire -->
  <path d="M 0 274 L 96 226 L 178 248 L 264 196 L 340 232 L 400 206 L 400 320 L 0 320 Z" fill="#0d111b"/>
  <line x1="264" y1="196" x2="264" y2="92" stroke="#e13f59" stroke-width="2"/>
  <circle cx="264" cy="92" r="3" fill="#e13f59"/>
  <rect x="256" y="128" width="16" height="6" rx="3" fill="#e13f59" opacity="0.85"/>
  <!-- Wet asphalt horizon -->
  <rect y="308" width="400" height="122" fill="#090b10"/>
  <line x1="20" y1="308" x2="380" y2="308" stroke="#2cb7c9" stroke-opacity="0.3" stroke-width="1"/>
  <!-- Sharp neo-noir headlight & neon slashes -->
  <polygon points="154,302 68,430 142,430" fill="#f0d97a" opacity="0.22"/>
  <polygon points="246,302 258,430 332,430" fill="#f0d97a" opacity="0.22"/>
  <rect x="64" y="346" width="108" height="3" fill="url(#ns-cyan)"/>
  <rect x="228" y="368" width="112" height="3" fill="url(#ns-crimson)"/>
  <rect x="118" y="394" width="164" height="2" fill="#f0a53a" opacity="0.45"/>
  <!-- Minimalist sedan silhouette -->
  <g transform="translate(200, 294)">
    <rect x="-18" y="-32" width="36" height="10" fill="#f0a53a"/>
    <path d="M -38 -18 H 38 L 54 0 H -54 Z" fill="#151822" stroke="#2cb7c9" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M -58 0 H 58 L 62 20 H -62 Z" fill="#0b0d12" stroke="#282d3d" stroke-width="1.5"/>
    <rect x="-50" y="6" width="16" height="6" fill="#fff1a8"/>
    <rect x="34" y="6" width="16" height="6" fill="#fff1a8"/>
  </g>
  <text x="200" y="484" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="#f2f4f8" letter-spacing="7">NIGHT</text>
  <text x="200" y="524" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="#2cb7c9" letter-spacing="8">SHIFT</text>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#f2f4f8" stroke-opacity="0.1"/>
</svg>
