<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="steamNight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="70%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="lanternBeam" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="1"/>
      <stop offset="25%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="headlightFan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#steamNight)"/>

  <!-- Billowing Steam Clouds -->
  <g fill="#71717a" opacity="0.25">
    <circle cx="160" cy="140" r="75"/>
    <circle cx="240" cy="120" r="90"/>
    <circle cx="120" cy="200" r="60"/>
    <circle cx="280" cy="190" r="70"/>
    <circle cx="200" cy="170" r="85"/>
  </g>

  <!-- Giant Headlight Cone of Light pouring forward onto the tracks -->
  <polygon points="200,245 40,550 360,550" fill="url(#headlightFan)"/>

  <!-- Railway Tracks receding in perspective -->
  <g stroke="#a1a1aa" stroke-width="3">
    <!-- Left Rail -->
    <line x1="170" y1="340" x2="10" y2="600"/>
    <!-- Right Rail -->
    <line x1="230" y1="340" x2="390" y2="600"/>
  </g>
  <!-- Wooden Sleepers (Ties) in perspective -->
  <g stroke="#3f3f46" stroke-width="4" opacity="0.8">
    <line x1="165" y1="350" x2="235" y2="350"/>
    <line x1="155" y1="370" x2="245" y2="370"/>
    <line x1="140" y1="400" x2="260" y2="400"/>
    <line x1="120" y1="435" x2="280" y2="435"/>
    <line x1="95" y1="475" x2="305" y2="475"/>
    <line x1="60" y1="525" x2="340" y2="525"/>
    <line x1="15" y1="585" x2="385" y2="585"/>
  </g>

  <!-- 1941 Steam Locomotive Front Facing -->
  <g transform="translate(200, 240)">
    <!-- Smokestack -->
    <rect x="-14" y="-75" width="28" height="35" rx="3" fill="#09090b" stroke="#3f3f46" stroke-width="1.5"/>
    <ellipse cx="0" cy="-75" rx="18" ry="5" fill="#27272a"/>

    <!-- Cab Roof silhouette behind boiler -->
    <path d="M -50 -45 L 50 -45 L 55 -10 L -55 -10 Z" fill="#18181b"/>

    <!-- Cylindrical Boiler Front -->
    <circle cx="0" cy="0" r="58" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <circle cx="0" cy="0" r="50" fill="#09090b"/>
    <circle cx="0" cy="0" r="42" fill="#18181b"/>

    <!-- Central Round Boiler Door & Hinges -->
    <circle cx="0" cy="0" r="32" fill="#09090b" stroke="#52525b" stroke-width="2"/>
    <line x1="-32" y1="0" x2="32" y2="0" stroke="#52525b" stroke-width="2"/>

    <!-- Soviet / Historic Red Star emblem on boiler -->
    <polygon points="0,-18 5,-5 18,-5 8,4 12,16 0,8 -12,16 -8,4 -18,-5 -5,-5" fill="#dc2626"/>

    <!-- Locomotive Giant Central Lantern / Headlight -->
    <rect x="-15" y="5" width="30" height="24" rx="4" fill="#27272a" stroke="#71717a" stroke-width="1.5"/>
    <circle cx="0" cy="17" r="14" fill="url(#lanternBeam)"/>
    <circle cx="0" cy="17" r="6" fill="#ffffff"/>

    <!-- Cowcatcher / Front Grill (Pilot) -->
    <polygon points="-65,58 65,58 45,95 -45,95" fill="#09090b" stroke="#52525b" stroke-width="2"/>
    <line x1="-35" y1="60" x2="-25" y2="92" stroke="#71717a" stroke-width="2"/>
    <line x1="-15" y1="60" x2="-10" y2="92" stroke="#71717a" stroke-width="2"/>
    <line x1="15" y1="60" x2="10" y2="92" stroke="#71717a" stroke-width="2"/>
    <line x1="35" y1="60" x2="25" y2="92" stroke="#71717a" stroke-width="2"/>

    <!-- Buffer beams and cylinders -->
    <rect x="-75" y="45" width="22" height="35" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
    <rect x="53" y="45" width="22" height="35" rx="4" fill="#18181b" stroke="#3f3f46" stroke-width="1.5"/>
  </g>

  <!-- Typography -->
  <text x="200" y="65" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#f59e0b" letter-spacing="4">DECEMBER 1941</text>

  <text x="200" y="490" text-anchor="middle" font-family="'Georgia', serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="3">LAST TRAIN TO</text>
  <text x="200" y="528" text-anchor="middle" font-family="'Georgia', serif" font-size="34" font-weight="900" fill="#f59e0b" letter-spacing="4">TURKESTAN</text>

  <rect x="150" y="546" width="100" height="1.5" fill="#f59e0b" opacity="0.7"/>
  <text x="200" y="568" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#a1a1aa" letter-spacing="3">DRAMA · HISTORY · 16+</text>
</svg>