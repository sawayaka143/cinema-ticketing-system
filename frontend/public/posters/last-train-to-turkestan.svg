<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="lt-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0c10"/>
      <stop offset="60%" stop-color="#1c1816"/>
      <stop offset="100%" stop-color="#090a0d"/>
    </linearGradient>
    <radialGradient id="lt-beam" cx="50%" cy="38%" r="46%">
      <stop offset="0%" stop-color="#fff4db" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#f0a53a" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#b85a1a" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0b0c10" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#lt-sky)"/>
  <rect width="400" height="600" fill="url(#lt-beam)"/>
  <!-- Constructivist crimson disc & steam bands -->
  <circle cx="200" cy="185" r="96" fill="#c8372d" opacity="0.22"/>
  <path d="M 40 248 H 360" stroke="#f0a53a" stroke-opacity="0.2" stroke-width="1"/>
  <!-- Perspective beam & rails -->
  <polygon points="200,222 52,430 348,430" fill="#f0a53a" opacity="0.16"/>
  <g stroke="#d4cfc7" stroke-width="2.5" opacity="0.72">
    <line x1="184" y1="274" x2="54" y2="430"/>
    <line x1="216" y1="274" x2="346" y2="430"/>
  </g>
  <g stroke="#6b655c" stroke-width="2" opacity="0.55">
    <line x1="164" y1="298" x2="236" y2="298"/>
    <line x1="142" y1="324" x2="258" y2="324"/>
    <line x1="116" y1="354" x2="284" y2="354"/>
    <line x1="86" y1="390" x2="314" y2="390"/>
  </g>
  <!-- Monolithic locomotive silhouette -->
  <g transform="translate(200, 214)">
    <rect x="-12" y="-70" width="24" height="32" fill="#0d0e12" stroke="#524d47" stroke-width="1.5"/>
    <rect x="-46" y="-44" width="92" height="36" fill="#14151a"/>
    <circle cx="0" cy="0" r="52" fill="#0d0e12" stroke="#6b655c" stroke-width="2"/>
    <circle cx="0" cy="0" r="36" fill="#14151a" stroke="#c8372d" stroke-width="1.5"/>
    <polygon points="0,-24 5,-9 20,-9 8,0 12,14 0,6 -12,14 -8,0 -20,-9 -5,-9" fill="#c8372d" opacity="0.9"/>
    <circle cx="0" cy="18" r="10" fill="#fff4db"/>
    <polygon points="-56,52 56,52 40,78 -40,78" fill="#0d0e12" stroke="#6b655c" stroke-width="1.5"/>
  </g>
  <!-- Constructivist title block -->
  <text x="200" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="700" fill="#f3efe8" letter-spacing="4">LAST TRAIN TO</text>
  <text x="200" y="522" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#f0a53a" letter-spacing="5">TURKESTAN</text>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#f3efe8" stroke-opacity="0.1"/>
</svg>
