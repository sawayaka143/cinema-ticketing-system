<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="gk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24110b"/>
      <stop offset="55%" stop-color="#3c1b10"/>
      <stop offset="100%" stop-color="#170a06"/>
    </linearGradient>
    <radialGradient id="gk-hearth" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#f0a53a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#c95b2b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#24110b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gk-vessel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d96b38"/>
      <stop offset="100%" stop-color="#8b3117"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#gk-bg)"/>
  <rect width="400" height="600" fill="url(#gk-hearth)"/>
  <!-- Architectural arch -->
  <path d="M 64 420 V 210 A 136 136 0 0 1 336 210 V 420 Z" fill="#180b07" opacity="0.55"/>
  <path d="M 88 420 V 215 A 112 112 0 0 1 312 215 V 420" fill="none" stroke="#f0a53a" stroke-opacity="0.28" stroke-width="1.5"/>
  <!-- Rising steam curves -->
  <g fill="none" stroke="#f6e7d2" stroke-width="2" stroke-linecap="round" opacity="0.45">
    <path d="M 168 232 C 154 196 186 164 170 128"/>
    <path d="M 200 224 C 216 184 184 148 202 108"/>
    <path d="M 232 232 C 248 196 216 164 234 128"/>
  </g>
  <!-- Warm sun / copper plate -->
  <circle cx="200" cy="238" r="68" fill="#f0a53a" opacity="0.16"/>
  <!-- Modernist ceramic pot silhouette -->
  <path d="M 134 274 H 266 L 254 348 C 250 374 228 386 200 386 C 172 386 150 374 146 348 Z" fill="url(#gk-vessel)"/>
  <rect x="122" y="264" width="156" height="12" rx="2" fill="#f0a53a" opacity="0.88"/>
  <rect x="108" y="286" width="22" height="10" rx="2" fill="#b44922"/>
  <rect x="270" y="286" width="22" height="10" rx="2" fill="#b44922"/>
  <!-- Subtle ceramic highlight -->
  <path d="M 156 286 L 164 358" stroke="#f6e7d2" stroke-width="2" stroke-opacity="0.3" stroke-linecap="round"/>
  <!-- Table horizon -->
  <line x1="48" y1="386" x2="352" y2="386" stroke="#f0a53a" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- Editorial title lockup -->
  <text x="200" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#f6e7d2" letter-spacing="3">GRANDMA'S</text>
  <text x="200" y="516" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#f0a53a" letter-spacing="4">KITCHEN</text>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#f6e7d2" stroke-opacity="0.1"/>
</svg>
