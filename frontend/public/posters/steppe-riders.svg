  </g>
  <text x="200" y="482" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="800" fill="#f4cfa0" letter-spacing="6">STEPPE</text>
  <text x="200" y="522" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="#f6efe8" letter-spacing="7">RIDERS</text>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#f6efe8" stroke-opacity="0.1"/>
