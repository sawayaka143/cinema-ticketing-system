      <stop offset="0%" stop-color="#1b0c12"/>
      <stop offset="55%" stop-color="#6b1d28"/>
      <stop offset="100%" stop-color="#1c0d07"/>
    </linearGradient>
    <radialGradient id="sr-sun" cx="50%" cy="40%" r="36%">
      <stop offset="0%" stop-color="#f5c678"/>
      <stop offset="52%" stop-color="#e37c39" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6b1d28" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sr-sky)"/>
  <rect width="400" height="600" fill="url(#sr-sun)"/>
  <!-- Monumental solar disc -->
