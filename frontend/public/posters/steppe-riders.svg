<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="steppeSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d132c"/>
      <stop offset="35%" stop-color="#801336"/>
      <stop offset="65%" stop-color="#c72c41"/>
      <stop offset="85%" stop-color="#ee4540"/>
      <stop offset="100%" stop-color="#f8a488"/>
    </linearGradient>
    <linearGradient id="steppeGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d1e11"/>
      <stop offset="40%" stop-color="#210f07"/>
      <stop offset="100%" stop-color="#0e0603"/>
    </linearGradient>
    <radialGradient id="steppeSun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4e6"/>
      <stop offset="30%" stop-color="#fbd46d"/>
      <stop offset="70%" stop-color="#f39c12"/>
      <stop offset="100%" stop-color="#e67e22" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="600" fill="url(#steppeSky)"/>

  <!-- Setting Sun -->
  <circle cx="200" cy="270" r="110" fill="url(#steppeSun)"/>
  <circle cx="200" cy="270" r="60" fill="#fff9db"/>

  <!-- Distant Mountains -->
  <polygon points="-20,320 60,260 140,310 220,240 310,305 420,250 420,360 -20,360" fill="#4a1525" opacity="0.8"/>
  <polygon points="-20,340 90,290 180,335 270,285 360,330 420,300 420,370 -20,370" fill="#300d1a" opacity="0.9"/>

  <!-- Steppe rolling hills -->
  <path d="M -20 370 Q 100 340, 240 375 T 420 365 L 420 600 L -20 600 Z" fill="url(#steppeGround)"/>
  <path d="M -20 405 Q 160 380, 420 410 L 420 600 L -20 600 Z" fill="#1c0b05"/>
  <path d="M -20 450 Q 180 430, 420 460 L 420 600 L -20 600 Z" fill="#0d0402"/>

  <!-- Three Horse Riders Silhouette on the Hill Ridge (around y=360-390) -->
  <!-- Rider 1 (Center Leader) -->
  <g transform="translate(180, 325) scale(0.65)" fill="#0d0402">
    <!-- Horse -->
    <path d="M 15 45 C 5 40, -5 35, -15 32 C -20 30, -25 35, -28 42 L -35 60 L -30 62 L -24 48 C -22 55, -20 65, -18 75 L -12 75 C -15 62, -14 52, -10 46 C -2 46, 12 45, 22 52 C 24 58, 25 68, 26 76 L 32 76 C 30 65, 30 54, 28 46 C 35 44, 42 36, 45 28 C 48 20, 45 10, 42 6 L 38 12 C 36 8, 30 15, 28 20 C 24 25, 20 35, 15 45 Z"/>
    <!-- Tail -->
    <path d="M -26 40 C -35 45, -42 55, -45 65 C -42 60, -35 50, -25 45 Z"/>
    <!-- Rider -->
    <circle cx="8" cy="16" r="5"/>
    <!-- Spear/Banner -->
    <line x1="-5" y1="35" x2="35" y2="-10" stroke="#0d0402" stroke-width="2"/>
    <polygon points="35,-10 32,-4 22,-6" fill="#c72c41"/>
    <!-- Torso -->
    <path d="M 5 21 L 12 33 L 4 35 L 2 23 Z"/>
  </g>

  <!-- Rider 2 (Left) -->
  <g transform="translate(110, 335) scale(0.55)" fill="#1c0b05">
    <path d="M 15 45 C 5 40, -5 35, -15 32 C -20 30, -25 35, -28 42 L -35 60 L -30 62 L -24 48 C -22 55, -20 65, -18 75 L -12 75 C -15 62, -14 52, -10 46 C -2 46, 12 45, 22 52 C 24 58, 25 68, 26 76 L 32 76 C 30 65, 30 54, 28 46 C 35 44, 42 36, 45 28 C 48 20, 45 10, 42 6 L 38 12 C 36 8, 30 15, 28 20 C 24 25, 20 35, 15 45 Z"/>
    <circle cx="8" cy="16" r="5"/>
    <path d="M 5 21 L 12 33 L 4 35 L 2 23 Z"/>
  </g>

  <!-- Rider 3 (Right) -->
  <g transform="translate(260, 340) scale(0.55)" fill="#1c0b05">
    <path d="M 15 45 C 5 40, -5 35, -15 32 C -20 30, -25 35, -28 42 L -35 60 L -30 62 L -24 48 C -22 55, -20 65, -18 75 L -12 75 C -15 62, -14 52, -10 46 C -2 46, 12 45, 22 52 C 24 58, 25 68, 26 76 L 32 76 C 30 65, 30 54, 28 46 C 35 44, 42 36, 45 28 C 48 20, 45 10, 42 6 L 38 12 C 36 8, 30 15, 28 20 C 24 25, 20 35, 15 45 Z"/>
    <circle cx="8" cy="16" r="5"/>
    <path d="M 5 21 L 12 33 L 4 35 L 2 23 Z"/>
  </g>

  <!-- Title & Typography -->
  <text x="200" y="70" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="600" fill="#fbd46d" letter-spacing="4">AN EPIC HISTORICAL JOURNEY</text>

  <text x="200" y="505" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="34" font-weight="900" fill="#f8a488" letter-spacing="4">STEPPE</text>
  <text x="200" y="540" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="6">RIDERS</text>

  <rect x="150" y="555" width="100" height="1.5" fill="#f39c12" opacity="0.7"/>
  <text x="200" y="575" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="600" fill="#d4a373" letter-spacing="3">ADVENTURE · HISTORY · 2026</text>
</svg>