<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="auroraSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="35%" stop-color="#1c2541"/>
      <stop offset="65%" stop-color="#3a506b"/>
      <stop offset="100%" stop-color="#5bc0be"/>
    </linearGradient>
    <linearGradient id="auroraRibbon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0"/>
      <stop offset="30%" stop-color="#34d399" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="snowSlope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="400" height="600" fill="url(#auroraSky)"/>

  <!-- Aurora Ribbon Swirl -->
  <path d="M -50 140 Q 120 70, 240 130 T 450 90 L 450 170 Q 280 180, 150 120 T -50 200 Z" fill="url(#auroraRibbon)"/>

  <!-- Crescent Moon -->
  <path d="M 330 65 A 25 25 0 1 0 355 105 A 28 28 0 1 1 330 65 Z" fill="#fef08a"/>

  <!-- Star Constellations -->
  <g fill="#ffffff">
    <circle cx="50" cy="50" r="1.5"/>
    <circle cx="95" cy="75" r="1.2"/>
    <circle cx="160" cy="45" r="1.8"/>
    <circle cx="210" cy="85" r="1"/>
    <circle cx="280" cy="40" r="1.5"/>
    <circle cx="110" cy="130" r="1.3"/>
    <circle cx="70" cy="180" r="1"/>
    <circle cx="370" cy="160" r="1.2"/>
    <circle cx="20" cy="220" r="1.4"/>
    <circle cx="380" cy="240" r="1"/>
  </g>

  <!-- Distant Jagged Mountains -->
  <polygon points="-30,340 70,230 160,300 240,210 320,280 430,220 430,420 -30,420" fill="#1e293b" opacity="0.65"/>
  <!-- Mountain snow caps -->
  <polygon points="70,230 50,260 90,260" fill="#f8fafc" opacity="0.8"/>
  <polygon points="240,210 215,245 265,245" fill="#f8fafc" opacity="0.8"/>
  <polygon points="430,220 400,250 430,270" fill="#f8fafc" opacity="0.8"/>

  <!-- Foreground Snowy Rock Cliff -->
  <path d="M -20 410 Q 150 350, 270 380 Q 340 400, 420 440 L 420 600 L -20 600 Z" fill="#0f172a"/>
  <path d="M -20 400 Q 140 345, 260 375 L 260 395 Q 140 365, -20 420 Z" fill="#e2e8f0" opacity="0.9"/>

  <!-- Little Snow Leopard Silhouette on Cliff Rock (Around x=220, y=340) -->
  <g transform="translate(200, 310) scale(0.85)" fill="#0f172a">
    <!-- Rock perch -->
    <path d="M -10 70 Q 30 60, 70 70 L 60 90 L 0 90 Z" fill="#1e293b"/>
    <!-- Body -->
    <ellipse cx="25" cy="45" rx="20" ry="14" transform="rotate(-15 25 45)"/>
    <!-- Hind leg & paw -->
    <ellipse cx="12" cy="55" rx="7" ry="12"/>
    <circle cx="10" cy="65" r="5"/>
    <!-- Front legs & paws -->
    <rect x="30" y="48" width="6" height="18" rx="3"/>
    <rect x="38" y="46" width="6" height="20" rx="3"/>
    <!-- Long fluffy tail curved up and around -->
    <path d="M 6 48 C -10 50, -22 40, -18 25 C -15 15, -4 18, -4 28 C -4 36, 4 45, 10 48 Z" fill="#0f172a"/>
    <!-- Chest / Neck -->
    <path d="M 32 38 L 42 22 L 28 26 Z"/>
    <!-- Head -->
    <circle cx="42" cy="20" r="11"/>
    <!-- Cute ears -->
    <polygon points="34,14 38,7 43,12"/>
    <polygon points="42,12 47,8 50,15"/>
    <!-- Snout & Whisker highlight -->
    <ellipse cx="48" cy="23" rx="4" ry="3"/>
    <!-- Little shiny eye -->
    <circle cx="45" cy="18" r="1.5" fill="#5bc0be"/>
  </g>

  <!-- Typography -->
  <text x="200" y="70" text-anchor="middle" font-family="'Nunito', 'Arial Rounded MT Bold', sans-serif" font-size="11" font-weight="800" fill="#5bc0be" letter-spacing="4">AN ENCHANTING ANIMATED TALE</text>

  <text x="200" y="495" text-anchor="middle" font-family="'Nunito', 'Arial Rounded MT Bold', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="2">LITTLE SNOW</text>
  <text x="200" y="535" text-anchor="middle" font-family="'Nunito', 'Arial Rounded MT Bold', sans-serif" font-size="36" font-weight="900" fill="#67e8f9" letter-spacing="4">LEOPARD</text>

  <rect x="150" y="552" width="100" height="1.5" fill="#5bc0be" opacity="0.6"/>
  <text x="200" y="572" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="10" font-weight="700" fill="#cbd5e1" letter-spacing="3">ANIMATION · FAMILY · 0+</text>
</svg>