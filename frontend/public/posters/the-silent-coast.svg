<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="sc-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07131e"/>
      <stop offset="55%" stop-color="#14334b"/>
      <stop offset="100%" stop-color="#050d16"/>
    </linearGradient>
    <linearGradient id="sc-beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d076" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#f5d076" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f5d076" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#sc-sky)"/>
  <!-- Light wedge -->
  <polygon points="122,232 400,148 400,290" fill="url(#sc-beam)"/>
  <!-- Calm dark sea horizon -->
  <rect y="318" width="400" height="112" fill="#06101a"/>
  <line x1="20" y1="318" x2="380" y2="318" stroke="#629ab3" stroke-opacity="0.35" stroke-width="1"/>
  <line x1="180" y1="334" x2="332" y2="334" stroke="#f5d076" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="210" y1="350" x2="310" y2="350" stroke="#f5d076" stroke-opacity="0.2" stroke-width="1.5"/>
  <!-- Cliff and minimalist lighthouse column -->
  <path d="M 0 364 L 156 322 L 136 430 L 0 430 Z" fill="#040a11"/>
  <polygon points="112,332 130,332 126,232 116,232" fill="#dce6ec"/>
  <polygon points="115,286 127,286 126,266 116,266" fill="#9c2c2c"/>
  <circle cx="121" cy="232" r="6" fill="#fff6cb"/>
  <text x="200" y="482" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#eef4f7" letter-spacing="4">THE SILENT</text>
  <text x="200" y="522" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="35" font-weight="700" fill="#f5d076" letter-spacing="5">COAST</text>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#dce6ec" stroke-opacity="0.1"/>
</svg>
