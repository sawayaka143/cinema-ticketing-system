<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <defs>
    <linearGradient id="o9-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="50%" stop-color="#0d1424"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>
    <radialGradient id="o9-eclipse" cx="50%" cy="40%" r="42%">
      <stop offset="0%" stop-color="#6cc5e0" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#224578" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#05070c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#o9-bg)"/>
  <rect width="400" height="600" fill="url(#o9-eclipse)"/>
  <!-- Precision orbital geometry -->
  <circle cx="200" cy="238" r="144" fill="none" stroke="#6cc5e0" stroke-opacity="0.18" stroke-width="1"/>
  <circle cx="200" cy="238" r="108" fill="none" stroke="#6cc5e0" stroke-opacity="0.28" stroke-width="1" stroke-dasharray="4 6"/>
  <ellipse cx="200" cy="238" rx="168" ry="34" fill="none" stroke="#6cc5e0" stroke-opacity="0.4" stroke-width="1.5" transform="rotate(-18 200 238)"/>
  <!-- Dark planet sphere & bright rim -->
  <circle cx="200" cy="238" r="76" fill="#070a12" stroke="#6cc5e0" stroke-opacity="0.65" stroke-width="1.5"/>
  <path d="M 136 196 A 76 76 0 0 1 258 186" fill="none" stroke="#e9f6fb" stroke-width="2" stroke-opacity="0.7"/>
  <!-- Front orbital arc -->
  <path d="M 42 292 A 168 34 -18 0 0 358 184" fill="none" stroke="#e2a84b" stroke-width="2" stroke-opacity="0.85"/>
  <!-- Station beacon -->
  <circle cx="294" cy="204" r="4" fill="#f0a53a"/>
  <line x1="200" y1="74" x2="200" y2="402" stroke="#6cc5e0" stroke-opacity="0.12" stroke-width="1"/>
  <text x="200" y="484" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="36" font-weight="800" fill="#eef4f7" letter-spacing="8">ORBIT</text>
  <text x="200" y="524" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="700" fill="#6cc5e0" letter-spacing="10">NINE</text>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#6cc5e0" stroke-opacity="0.14"/>
</svg>
