name: Bug
description: Something is broken
labels: ["type:fix"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the page/endpoint, what you did, what you expected, and what you got (error text, status code).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - production
        - preview deploy
        - local
    validations:
      required: true
