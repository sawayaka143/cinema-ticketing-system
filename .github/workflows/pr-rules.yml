name: PR rules

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: read

# No concurrency group on purpose: opening a PR with labels fires several events at once,
# and a cancelled run can become the required check's result and block the PR.
# Each run reads the PR's current state instead, so overlapping runs agree.

jobs:
  rules:
    name: PR rules
    runs-on: ubuntu-latest
    steps:
      - name: Check title, issue link, size, area and UI checklist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          PR: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          MAX_LINES: "1000"
        run: |
          set -uo pipefail
          errors=0
          fail() { echo "::error::$1"; errors=$((errors+1)); }
          ok()   { echo "OK  $1"; }

          # Current PR state, not the snapshot in the event that started this run
          pr_json=$(gh pr view "$PR" --repo "$REPO" --json title,body,headRefName) || {
            echo "::error::Could not read PR #$PR"; exit 1; }
          TITLE=$(jq -r '.title' <<< "$pr_json")
          BODY=$(jq -r '.body // ""' <<< "$pr_json")
          BRANCH=$(jq -r '.headRefName' <<< "$pr_json")

          # 2. Branch name is no longer enforced (the issue link in the body is what counts)
          branch_issue=""
          if [[ "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test)/([0-9]+)-[a-z0-9-]+$ ]]; then
            branch_issue="${BASH_REMATCH[2]}"
          fi

          # 3. Linked issue in the body
          if grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' <<< "$BODY"; then
            ok "linked issue"
            body_issue=$(grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' <<< "$BODY" | head -1 | grep -Eo '[0-9]+')
            if [[ -n "$branch_issue" && "$body_issue" != "$branch_issue" ]]; then
              echo "::warning::Branch refers to issue #$branch_issue but the body closes #$body_issue."
            fi
          else
            fail "PR body must link its issue with 'Closes #<number>'."
          fi

          # Changed files
          gh api --paginate "repos/$REPO/pulls/$PR/files" \
            --jq '.[] | [.filename, (.additions + .deletions)] | @tsv' > files.tsv

          # 4. Size (lockfiles and generated files excluded)
          size=$(grep -Ev '(^|/)(package-lock\.json|openapi\.json|schema\.d\.ts)'$'\t' files.tsv | awk -F'\t' '{s+=$2} END {print s+0}')
          size_ok_by_owner=$(gh api --paginate "repos/$REPO/issues/$PR/events" \
            --jq "[.[] | select(.event==\"labeled\" and .label.name==\"size-ok\" and .actor.login==\"$OWNER\")] | length" | awk '{s+=$1} END {print s+0}')
          has_size_label=$(gh pr view "$PR" --repo "$REPO" --json labels --jq '[.labels[].name] | index("size-ok") != null')
          if (( size <= MAX_LINES )); then
            ok "size: $size changed lines"
          elif [[ "$has_size_label" == "true" && "$size_ok_by_owner" -gt 0 ]]; then
            ok "size: $size changed lines (allowed by owner's size-ok label)"
          else
            fail "PR changes $size lines (limit $MAX_LINES, lockfiles and generated files excluded). Split it into smaller PRs. Only the owner can allow an exception with the 'size-ok' label."
          fi

          # 5. Areas: frontend/ is owner-only; workflow and rule files only warn
          if [[ "$AUTHOR" != "$OWNER" ]]; then
            restricted=$(cut -f1 files.tsv | grep -E '^frontend/' || true)
            if [[ -n "$restricted" ]]; then
              fail "frontend/ is owner-only (see AGENTS.md). Open an issue instead: $(tr '\n' ' ' <<< "$restricted")"
            else
              ok "areas"
            fi
            rules_touched=$(cut -f1 files.tsv | grep -E '^(\.github/|\.claude/|AGENTS\.md$|CLAUDE\.md$|TEAM\.md$)' || true)
            if [[ -n "$rules_touched" ]]; then
              echo "::warning::Workflow/rule files changed; the owner will look closely: $(tr '\n' ' ' <<< "$rules_touched")"
            fi
          fi

          echo
          if (( errors > 0 )); then
            echo "$errors rule(s) failed. Fix them; editing the PR title or body re-runs this check."
            exit 1
          fi
          echo "All PR rules passed."
