name: Deploy

# Production deploys happen only here, in order: database migrations → backend → frontend.
# Vercel's Git integration builds preview deployments for PRs; automatic production builds
# from main are switched off in each app's vercel.json (git.deploymentEnabled.main = false).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate production database
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check secrets
        id: secrets
        working-directory: .   # backend/ doesn't exist yet: checkout runs after this step
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
        run: |
          if [[ -z "$DATABASE_URL" ]]; then
            echo "::warning::PROD_MIGRATION_DATABASE_URL is not set in the 'production' environment. Skipping migrations."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-python@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Alembic upgrade head
        if: steps.secrets.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.PROD_MIGRATION_DATABASE_URL }}
        run: |
          pip install -r requirements.txt
          alembic upgrade head

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    strategy:
      max-parallel: 1   # backend first, then frontend
      matrix:
        include:
          - app: backend
            project_secret: VERCEL_BACKEND_PROJECT_ID
          - app: frontend
            project_secret: VERCEL_FRONTEND_PROJECT_ID
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_secret] }}
    steps:
      - uses: actions/checkout@v5
      - name: Deploy to Vercel (production)
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::warning::Vercel secrets for ${{ matrix.app }} are not set in the 'production' environment. Skipping deploy."
            exit 0
          fi
          # Run from the repo root: the Vercel project's Root Directory setting picks the app folder.
          url=$(npx --yes vercel@65 deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed ${{ matrix.app }}: $url"
          echo "### ${{ matrix.app }}: $url" >> "$GITHUB_STEP_SUMMARY"
