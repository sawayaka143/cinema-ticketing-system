name: Owner approval

# The owner's approval is no longer required to merge (relaxed in #42).
# This job is kept and always passes, because the `main` ruleset lists "Owner approval"
# as a required status check; deleting it would block every PR.
# To require approval again, restore this file from git history.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read

jobs:
  owner-approval:
    name: Owner approval
    runs-on: ubuntu-latest
    steps:
      - run: echo "Owner approval is not required any more."
